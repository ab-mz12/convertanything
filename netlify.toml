[build]
  command = "npm run build"
  publish = "dist"

# Long-lived caching for hashed assets and the FFmpeg core. index.html and the
# service worker are revalidated on every request.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
